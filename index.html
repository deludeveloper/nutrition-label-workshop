<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Read a Nutrition Label</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#edf4fa; --panel:#ffffff; --ink:#0e2440; --muted:#4a5d73; --line:#c9d8e6;
  --accent:#0b5cab; --accent-ink:#ffffff; --band:#0b4f97; --tan:#c9a57a; --sky:#7cc4ec;
  --hl:#9fd4f2; --low:#d7eadb; --high:#f6d6cf; --flag:#c8202a;
  --label:'Archivo','Helvetica Neue',Helvetica,sans-serif;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --sans:'Barlow','Helvetica Neue',Helvetica,sans-serif; --serif:'Barlow','Helvetica Neue',Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1624; --panel:#122236; --ink:#e6eef7; --muted:#a0b3c8; --line:#26394f;
    --accent:#76b6f0; --accent-ink:#0b1624; --band:#0a3d73; --tan:#b89266; --sky:#4a9fd0;
    --hl:#2f6f9f; --low:#1f3e30; --high:#4d2522; --flag:#ff7b72;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1624; --panel:#122236; --ink:#e6eef7; --muted:#a0b3c8; --line:#26394f;
  --accent:#76b6f0; --accent-ink:#0b1624; --band:#0a3d73; --tan:#b89266; --sky:#4a9fd0;
  --hl:#2f6f9f; --low:#1f3e30; --high:#4d2522; --flag:#ff7b72;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55;overflow-x:hidden}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 64px}
.brand{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.8vw,42px);letter-spacing:.005em;line-height:1;color:#fff;text-transform:uppercase;margin:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.crumbs{font-family:var(--sans);font-size:16px;color:#d6e6f5}
.crumbs button{background:none;border:0;padding:0;color:#fff;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Nutrition label */
.label{background:#fff;color:#111;border:2px solid #111;padding:10px 12px 12px;font-family:var(--label);width:100%;max-width:440px}
.label h2{margin:0;font-weight:900;font-size:clamp(38px,5vw,52px);line-height:.95;letter-spacing:-.02em}
.label .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid #111;padding:4px 6px;margin:0 -6px;width:calc(100% + 12px);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:16px;line-height:1.3;cursor:default;color:#111}
.label button.r{cursor:pointer;transition:background .15s}
.label button.r:hover,.label button.r.on{background:#bfe3f7}
.label .r.plain{border-top:0}
.label .thick{border-top:10px solid #111}
.label .mid{border-top:5px solid #111}
.label .b{font-weight:800}
.label .i1{padding-left:22px}
.label .i2{padding-left:40px}
.label .cal{font-size:34px;font-weight:900;line-height:1.05}
.label .small{font-size:13px}
.label .r.lo{background:#d7eadb}
.label .r.hi{background:#f6d6cf}
.label.mini{max-width:320px;padding:8px 10px}
.label.mini h2{font-size:34px}
.label.mini .r{font-size:13.5px;padding:3px 6px}
.label.mini .cal{font-size:26px}

.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;font-family:var(--sans);font-size:15px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.whole{font-family:var(--sans);font-size:15px;color:var(--muted);margin-top:10px;min-height:1.4em}

/* Home */
.home{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:48px;align-items:start}
.lead{font-family:var(--display);font-weight:700;font-size:clamp(26px,3vw,36px);line-height:1.12;letter-spacing:-.01em;margin:0 0 10px}
.lead mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 2px}
.hint{color:var(--muted);margin:0 0 28px}
.door{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:16px 18px;margin:0 0 14px;cursor:pointer}
.door:hover{border-color:var(--ink)}
.door h3{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:24px;color:var(--accent)}
.door p{margin:0;color:var(--muted);font-size:16px}
.ingr{font-family:var(--label);font-size:14px;line-height:1.45;color:var(--ink);margin-top:8px}
.ingr b{font-weight:800}
.more{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:8px 16px;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:15px}
.chip:hover{background:var(--ink);color:var(--bg)}

/* Topic page */
.topic{display:grid;grid-template-columns:320px minmax(0,1fr);gap:44px;align-items:start}
.side{position:sticky;top:20px}
.side .note{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:8px}
h1.t{font-family:var(--display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1;letter-spacing:0;margin:0 0 12px}
.lede{font-size:21px;line-height:1.45;max-width:36em;margin:0 0 26px}
details.bar{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;margin:0 0 12px}
details.bar[open]{border-color:var(--ink)}
details.bar>summary{list-style:none;cursor:pointer;padding:14px 18px;font-family:var(--display);font-weight:700;font-size:24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.bar>summary::-webkit-details-marker{display:none}
details.bar>summary::after{content:"+";font-weight:400;font-size:26px;line-height:1}
details.bar[open]>summary::after{content:"–"}
.body{padding:0 18px 18px;max-width:40em}
.body p{margin:0 0 12px}
.body ul{margin:0 0 12px;padding-left:22px}
.body li{margin:0 0 6px}
details.research{margin-top:24px;border-top:1.5px solid var(--ink);padding-top:10px}
details.research summary{cursor:pointer;font-family:var(--sans);font-weight:800;font-size:17px}
details.research ul{padding-left:20px;font-size:16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tight{margin:0;padding-left:20px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--sans)}

/* Widgets */
.tool{background:var(--bg);border-radius:6px;padding:14px 16px;margin:6px 0 12px;font-family:var(--sans);font-size:16px}
.tool label{display:inline-flex;align-items:center;gap:8px;margin:0 16px 8px 0}
.tool input[type=number]{width:90px;padding:6px 8px;border:1.5px solid var(--ink);border-radius:4px;background:var(--panel)}
.out{font-weight:800;font-size:20px;margin-top:6px}
.cubes{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.cube{width:18px;height:18px;background:var(--panel);border:1.5px solid var(--ink);border-radius:2px}
.cube.part{background:linear-gradient(90deg,var(--panel) 50%,transparent 50%);border-style:dashed}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:4px;padding:7px 14px;cursor:pointer;font-family:var(--sans);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:8px 0 12px}
.card{min-height:138px;background:var(--panel);border:1.5px solid var(--ink);border-radius:6px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card .nm{font-family:var(--sans);font-weight:800;font-size:18px;line-height:1.2}
.card .q{font-family:var(--sans);font-size:14px;color:var(--muted)}
.card .v{font-family:var(--sans);font-weight:800;font-size:15px}
.card .v.ok{color:var(--accent)}
.card .v.look{color:var(--flag)}
.card .ex{font-size:15px;line-height:1.4}
.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0 12px}
.hand div{border:1.5px solid var(--ink);border-radius:6px;padding:10px;font-family:var(--sans);text-align:center}
.hand svg{display:block;margin:0 auto 6px;width:44px;height:44px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
.form label{display:flex;flex-direction:column;gap:4px;margin:0;font-weight:600}
.form input[type=number],.form input[type=text]{width:100%;padding:8px;border:1.5px solid var(--ink);border-radius:4px;background:var(--panel)}
.full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:400}
.checks label{flex-direction:row;font-weight:400}
.verdict{margin-top:16px;padding:14px 16px;border-left:6px solid var(--hl);background:var(--panel)}

@media (max-width:900px){
  .home,.topic{grid-template-columns:minmax(0,1fr);gap:28px}
  .side{position:static}
  .label.mini{max-width:100%}
  .two,.form{grid-template-columns:minmax(0,1fr)}
  .hand{grid-template-columns:repeat(2,minmax(0,1fr))}
  body{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.prod{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;margin:0 0 2px}
.prodnote{font-size:15px;color:var(--muted);margin:0 0 12px}
.ilist{display:block;width:100%;max-width:440px;margin-top:12px;background:#fff;color:#111;border:2px solid #111;padding:10px 12px;text-align:left;font-family:var(--label);font-size:14.5px;line-height:1.5;cursor:pointer}
.ilist:hover{background:#eef8fe}
.ilist .tap{display:block;margin-top:6px;font-size:13px;color:#555}
mark.sug{background:#bfe3f7;color:#111;padding:0 2px}
.ilist-demo{background:#fff;color:#111;border:2px solid #111;padding:10px 12px;font-family:var(--label);font-size:15px;line-height:1.55;margin:8px 0 12px}
.doorgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.doorgrid .door{margin:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:10px 0}
.opt{background:var(--panel);border:1.5px solid var(--ink);border-radius:6px;padding:14px;text-align:left;cursor:pointer;font-family:var(--sans)}
.opt .nm{display:block;font-weight:800;font-size:18px;line-height:1.2}
.opt .facts{display:block;margin-top:8px;font-size:15px;font-weight:400}
.opt.right{box-shadow:inset 0 0 0 3px var(--accent)}
.opt[disabled]{cursor:default}
.gamebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--sans);font-size:15px;color:var(--muted)}
.feedback{font-family:var(--sans);margin:6px 0 10px}
.rank{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:10px 0}
.rank .opt{position:relative;padding-right:46px}
.badge{position:absolute;top:10px;right:10px;display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);align-items:center;justify-content:center;font-weight:800}
.tier{border-left:6px solid var(--line);padding:2px 0 2px 14px;margin:0 0 16px}
.tier.ok{border-color:var(--accent)}
.tier.mid{border-color:var(--hl)}
.tier.stop{border-color:var(--flag)}
.tier h4{margin:0 0 6px;font-family:var(--sans);font-size:18px}
@media (max-width:900px){.doorgrid,.opts{grid-template-columns:minmax(0,1fr)}}

.widepage{max-width:1180px}
.widepage h2,.topic article h2{font-family:var(--sans)}
.barsgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:14px;align-items:start}
.barcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.barpick{min-height:88px}
.barpick.picked{background:var(--ink);color:var(--bg)}
.barpick.picked .badge{background:#bfe3f7;color:#0e2440}
.label.bl{max-width:100%}
.label.bl .r{cursor:default}
.barresult .out{margin:0 0 4px}
.barresult p{margin:0;font-size:15px}
@media (max-width:1100px){.barsgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.barsgrid{grid-template-columns:minmax(0,1fr)}}

.shot{display:block;padding:0;border:1.5px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;cursor:zoom-in}
.shot img{display:block;width:100%;height:auto}
.lightbox{position:fixed;inset:0;background:rgba(10,14,12,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;z-index:50}
.lightbox img{max-width:min(92vw,900px);max-height:84vh;object-fit:contain;border-radius:6px;background:#fff}
.barresult p{margin:0 0 6px}
.steps{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 18px;padding:12px 14px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px}
.part{display:flex;flex-direction:column;gap:6px}
.pname{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted)}
.part.cur .pname{color:var(--accent)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-family:var(--sans);font-weight:600;font-size:14px;cursor:pointer;padding:0}
.dot.done{border-color:var(--accent);color:var(--accent)}
.dot.now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot:hover{border-color:var(--ink);color:var(--ink)}
.dot.now:hover{color:var(--accent-ink)}
.label div.r.on{background:#bfe3f7}
.barhead{display:flex;flex-direction:column;gap:2px}
.barhead .nm{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.barhead .facts{color:var(--muted);font-size:15px}
.cform{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:12px}
.cf{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:15px;line-height:1.25}
.cf input{padding:6px 8px;border:1.5px solid var(--ink);border-radius:4px;background:var(--panel);width:100%}
.cf.ok input{border-color:#2e8b57;box-shadow:inset 0 0 0 1px #2e8b57}
.cf.bad input{border-color:var(--flag);box-shadow:inset 0 0 0 1px var(--flag)}
.cf.count{margin-top:4px;padding-top:8px;border-top:1px solid var(--line)}
.cfhelp{font-weight:400;font-size:13.5px;color:var(--muted)}
.cf input::placeholder{color:var(--muted);opacity:.8}
.hint2{display:block;font-weight:600;font-size:14px;color:var(--flag)}
.cflags{display:flex;flex-direction:column;gap:5px;margin-top:4px;padding-top:8px;border-top:1px solid var(--line)}
.flagtitle{font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted)}
.cflag{display:block;font-size:15px;line-height:1.3;padding:2px 4px;border-radius:4px}
.cflag.ok{background:rgba(46,139,87,.12)}
.cflag.bad{background:var(--high)}
table.cmp td:first-child{font-weight:600;white-space:nowrap}
table.cmp td.good{background:var(--low)}
table.cmp td.bad{background:var(--high)}
table.cmp .tone{display:block;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
table.cmp td.good .tone{color:#1f6b3f}
table.cmp td.bad .tone{color:var(--flag)}
table.cmp small{color:var(--muted)}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--muted);margin:0 0 8px}
.legend .good,.legend .bad{padding:2px 10px;border-radius:4px;font-weight:600;color:var(--ink)}
.legend .good{background:var(--low)}
.legend .bad{background:var(--high)}
table.cmp th{font-family:var(--display);font-size:18px}
.pickrow{display:flex;flex-wrap:wrap;gap:8px}
.pickopt{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.pickopt.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.topic article h2{font-family:var(--display);font-size:30px;margin:26px 0 8px}

.band{background:var(--band);color:#fff}
.band .in{max-width:1180px;margin:0 auto;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.stripe{height:10px;background:linear-gradient(var(--tan),var(--tan)) top/100% 6px no-repeat,linear-gradient(var(--sky),var(--sky)) bottom/100% 4px no-repeat}
.wrap{padding-top:28px}
.front{display:flex;gap:18px;align-items:center;margin:0 0 18px}
.front img{width:132px;height:auto;flex-shrink:0;filter:drop-shadow(0 6px 10px rgba(11,79,151,.18))}
.front .tag{display:inline-block;margin-top:8px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--ink);background:var(--panel);border:1.5px solid var(--tan);padding:3px 10px}
.sidehead{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 6px;color:var(--muted)}
.startbtn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:14px 22px;font-family:var(--display);font-weight:700;font-size:24px;cursor:pointer;margin:0 0 26px}
.startbtn:hover{filter:brightness(1.08)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 18px;max-width:40em}
.progress span{display:block;height:100%;background:var(--accent)}
.stepno{font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted);margin:0 0 4px}
.tour{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:28px;padding-top:16px;border-top:2px solid var(--tan)}
.tour .prev{justify-self:start}
.tour .next{justify-self:end;text-align:right}
.tour button{border-radius:6px;padding:10px 16px;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:16px;line-height:1.25}
.tour .prev{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.tour .next{background:var(--accent);border:1.5px solid var(--accent);color:var(--accent-ink)}
.tour small{display:block;font-weight:400;opacity:.85}
.tour .count{font-family:var(--display);font-weight:600;color:var(--muted);text-align:center}
.btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.badge{background:var(--accent);color:var(--accent-ink)}
.barpick.picked{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.verdict{border-left-color:var(--tan)}
details.research{border-top-color:var(--tan)}
@media (max-width:600px){.tour{grid-template-columns:1fr 1fr}.tour .count{grid-column:1/-1;grid-row:1}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) table.cmp td.good .tone{color:#8ee0ac}}
:root[data-theme="dark"] table.cmp td.good .tone{color:#8ee0ac}

.titlerow{display:flex;align-items:center;gap:14px;margin:0 0 10px}
.titlerow .tt{flex:1;min-width:0}
.titlerow h1.t{margin:0}
.titlerow .stepno{margin:0 0 2px}
.arrow{flex-shrink:0;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.arrow.nx{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.arrow:hover{filter:brightness(1.08)}
.jump{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.snipbox{display:none}
.mstart{display:none}
@media (max-width:900px){
  .band .in{padding:10px 16px;gap:4px}
  .brand{font-size:22px}
  .crumbs{font-size:14px}
  .wrap{padding:16px 14px 48px}
  .side,.steps{display:none}
  .topic{gap:0}
  .titlerow{gap:10px;margin-bottom:10px}
  .arrow{width:40px;height:40px}
  h1.t{font-size:32px}
  .stepno{font-size:15px}
  .jump{display:block;margin:0 0 14px}
  .jump select{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--panel);font-size:16px}
  .snipbox{display:block;margin:0 0 14px}
  .mstart{display:block!important;width:100%;margin:0 0 18px}
  .label.snip{padding:6px 10px 4px}
  .topic article .label.snip h2{font-size:18px;margin:0 0 2px;font-family:var(--label)}
  .label.snip .r:not(.on),.label.snip .thick,.label.snip .mid{display:none}
  .label.snip .r.on{background:none;border-top:1px solid #111}
  .label.snip .cal{font-size:22px}
  .lede{font-size:18px;margin-bottom:18px}
  details.bar>summary{font-size:21px;padding:12px 14px}
  .body{padding:0 14px 14px}
}

.stepmenu select{font-family:var(--sans);font-size:15px;font-weight:600;color:#0e2440;background:#fff;border:0;border-radius:6px;padding:9px 12px;max-width:62vw;cursor:pointer}
.stepmenu select:hover{filter:brightness(.97)}
.front{gap:20px;align-items:center}
.front img{width:170px}
.prod{font-size:32px;line-height:1.05}
.startbtn{width:100%;max-width:440px;font-size:26px;padding:16px 22px}
.mhint{font-size:16px;margin:10px 0 18px;max-width:440px}
.explore{margin:0 0 20px}
.explore>summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);margin-bottom:12px}
@media (min-width:901px){ .mstart,.mhint{display:none} }
@media (max-width:900px){
  .dstart,.lead,.hint{display:none}
  .explore{margin-top:22px}
  .front img{width:150px}
  .prod{font-size:28px}
  .startbtn{font-size:24px;padding:15px 18px}
  .mhint{display:block;color:var(--muted)}
  .stepmenu select{font-size:14px;padding:7px 10px;max-width:56vw}
}

.topright{display:flex;align-items:center;gap:10px}
.homebtn{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1.5px solid rgba(255,255,255,.65);color:#fff;border-radius:6px;padding:7px 12px;font-family:var(--sans);font-weight:600;font-size:15px;cursor:pointer}
.homebtn:hover{background:rgba(255,255,255,.14)}
.home{align-items:start}
@media (max-width:900px){
  .homebtn span{display:none}
  .homebtn{padding:7px 9px}
}

.plan{display:flex;flex-direction:column;gap:2px;margin-top:26px;max-width:520px}
.plan div{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.plan div:last-child{border-bottom:1px solid var(--line)}
.pnum{font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent)}
.ptitle{font-family:var(--display);font-weight:700;font-size:20px}
.pdesc{grid-column:2;color:var(--muted);font-size:16px;line-height:1.35}
@media (max-width:900px){.plan{display:none}}
</style>

</head>

const P = {cal:250, fat:6, sat:2, chol:0, sod:130, carb:43, fib:5, sug:17, add:16, pro:10, vd:0, ca:45, fe:2, k:258};
const DV = {fat:78, sat:20, chol:300, sod:2300, carb:275, fib:28, add:50, vd:20, ca:1300, fe:18, k:4700};
const mult = 1;
let colorDV = false;

const LPCT = {fat:8, sat:9, chol:0, sod:6, carb:16, fib:19, add:32, vd:0, ca:4, fe:10, k:6};
const pct = (k,v) => LPCT[k] !== undefined ? Math.round(LPCT[k] * v / P[k] || 0) : Math.round(v / DV[k] * 100);
const num = v => (Math.round(v*10)/10).toString();
function cls(k,v){
  if(!colorDV || !['sat','sod','add','fib','vd','ca','fe','k'].includes(k)) return '';
  const p = pct(k,v), good = ['fib','vd','ca','fe','k'].includes(k);
  if(p >= 20) return good ? ' lo' : ' hi';
  if(p <= 5) return good ? ' hi' : ' lo';
  return '';
}

function labelHTML({mini=false, on=[]} = {}){
  const m = mult;
  const R = (id, route, inner, extra='') => mini ? `<div class="r${extra}${on.includes(id)?' on':''}">${inner}</div>` : `<button class="r${extra}${on.includes(id)?' on':''}" data-go="${route}">${inner}</button>`;
  const row = (id, route, k, name, amt, o={}) => {
    const v = P[k]*m;
    return R(id, route, `<span class="${o.ind||''}"><span class="${o.bold===false?'':'b'}">${name}</span> ${amt(v)}</span><span class="b">${pct(k,v)}%</span>`, (o.x||'') + cls(k,v));
  };
  const g = v => num(v)+'g', mg = v => Math.round(v)+'mg';
  const serv = m === 1 ? '1 bar (68g)' : `${m} bars (${68*m}g)`;
  return `<div class="label${mini?' mini':''}" aria-label="Nutrition Facts label for a Clif Bar">
    <h2>Nutrition Facts</h2>
    ${R('serving','serving',`<span>9 servings per container</span>`,' plain')}
    ${R('serving','serving',`<span class="b">${m===1?'Serving size':'Amount you eat'}</span><span class="b">${serv}</span>`,' plain')}
    <div class="thick"></div>
    ${R('calories','calories',`<span><span class="small b">Amount per serving</span><br><span class="cal">Calories</span></span><span class="cal">${P.cal*m}</span>`,' plain')}
    <div class="mid"></div>
    ${R('dv','dv',`<span></span><span class="b small">% Daily Value*</span>`,' plain')}
    ${row('fat','fat','fat','Total Fat',g)}
    ${row('fat','fat','sat','Saturated Fat',g,{ind:'i1',bold:false})}
    ${R('fat','fat',`<span class="i1"><i>Trans</i> Fat 0g</span><span></span>`)}
    ${row('fat','fat','chol','Cholesterol',mg)}
    ${row('sodium','sodium','sod','Sodium',mg)}
    ${row('carbs','carbs','carb','Total Carbohydrate',g)}
    ${row('fiber','carbs/fiber','fib','Dietary Fiber',g,{ind:'i1',bold:false})}
    ${R('sugars','carbs/sugars',`<span class="i1">Total Sugars ${num(P.sug*m)}g</span><span></span>`)}
    ${row('added','carbs/sugars','add','Includes',v=>num(v)+'g Added Sugars',{ind:'i2',bold:false})}
    ${R('protein','protein',`<span><span class="b">Protein</span> ${num(P.pro*m)}g</span><span></span>`)}
    <div class="thick"></div>
    ${row('vit','vitamins','vd','Vitamin D',v=>num(v)+'mcg',{bold:false,x:' plain'})}
    ${row('vit','vitamins','ca','Calcium',mg,{bold:false})}
    ${row('vit','vitamins','fe','Iron',mg,{bold:false})}
    ${row('vit','vitamins','k','Potassium',mg,{bold:false})}
    <div class="mid"></div>
    ${R('dv','dv',`<span class="small">* The % Daily Value tells you how much a nutrient in a serving contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.</span>`,' plain')}
  </div>`;
}

  protein:{title:'Protein', crumb:'Protein', on:['protein'], lede:'Protein is the most filling nutrient.', sections:[
    ['why','Why it keeps you full',`<p>Several things happen when you eat protein:</p>

    ['complete','Complete vs. incomplete protein',`<p>Protein is built from amino acids. Nine of them are <b>essential</b>, meaning your body can’t make them, so they have to come from food. A <b>complete</b> protein has enough of all nine. Meat, fish, eggs, dairy, and soy are complete.</p>

/* ---------- Walkthrough order ---------- */
const TOUR = ['start','serving','calories','dv','fat','sodium','carbs','protein','vitamins','ingredients','additives','upf','front','claims','supplements','rank','review'];
function tourHTML(id){
  const i = TOUR.indexOf(id);
  if(i < 0) return '';
  const prev = i > 0 ? TOUR[i-1] : '', next = i < TOUR.length-1 ? TOUR[i+1] : '';
  return `<nav class="tour" aria-label="Walkthrough">
    ${i > 0 ? `<button class="prev" data-go="${prev}">Back<small>${PAGES[prev].title}</small></button>` : `<button class="prev" data-go="">Back<small>The label</small></button>`}
    <span class="count">Step ${i+1} of ${TOUR.length}</span>
    ${next ? `<button class="next" data-go="${next}">Next<small>${PAGES[next].title}</small></button>` : `<button class="next" data-go="">Finish<small>Back to the label</small></button>`}
  </nav>`;
}

const PARTS = [['The label',0,9],['What’s in it',9,12],['Beyond the label',12,17]];
const CHEV = d => `<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="${d==='l'?'M12.5 4 6.5 10l6 6':'M7.5 4l6 6-6 6'}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function titleRow(id, title){
  const ti = TOUR.indexOf(id);
  if(ti < 0) return `<h1 class="t">${title}</h1>`;
  const prev = ti > 0 ? TOUR[ti-1] : '', next = ti < TOUR.length-1 ? TOUR[ti+1] : '';
  const part = PARTS.find(([,a,b]) => ti >= a && ti < b)[0];
  return `<div class="titlerow">
    <button class="arrow" data-go="${prev}" aria-label="Back: ${prev ? PAGES[prev].title : 'the label'}">${CHEV('l')}</button>
    <div class="tt"><p class="stepno">Step ${ti+1} of ${TOUR.length} · ${part}</p><h1 class="t">${title}</h1></div>
    <button class="arrow nx" data-go="${next}" aria-label="Next: ${next ? PAGES[next].title : 'finish'}">${CHEV('r')}</button>
  </div>`;
}

/* ---------- Render ---------- */
const app = document.getElementById('app');
const jump = document.getElementById('jump');
function fillJump(id){
  const ti = TOUR.indexOf(id);
  jump.innerHTML = `<option value="">${ti<0 ? 'Jump to a step' : 'All steps'}</option>` +
    TOUR.map((t,k)=>`<option value="${t}"${t===id?' selected':''}>${k+1}. ${PAGES[t].title}</option>`).join('');
}
jump.onchange = () => { if(jump.value) location.hash = '#/' + jump.value; };

function home(){
  fillJump('');
  app.innerHTML = `<div class="home">
    <div>
      <div class="front"><img src="${CLIF_FRONT}" alt="Clif Bar Chocolate Chip wrapper">
        <div><p class="prod">Clif Bar,<br>Chocolate Chip</p><p class="prodnote" style="margin:0">Organic oats. 10g of protein. “Sustained energy.”</p></div></div>
      <button class="startbtn mstart" data-go="start">Start the walkthrough</button>
      <p class="hint mhint">17 steps, about an hour. Tap Next at the bottom of each page.</p>
      ${labelHTML()}
      <button class="ilist" data-go="ingredients">${US_LIST}<span class="tap">Sweeteners highlighted. Tap to open the ingredient list.</span></button>
      <p class="prodnote" style="margin-top:8px">Based on the current US label. Recipes change, so check the package you have.</p>
    </div>
    <div>
      <p class="lead">Protein and fiber fill you up. <mark>Added sugar doesn’t.</mark></p>
      <p class="hint">Tap <b>Start the walkthrough</b> and follow along. Afterward, tap any line of the label to revisit a topic, or use the menu at the top.</p>
      <button class="startbtn dstart" data-go="start">Start the walkthrough</button>
      <div class="plan">
        <div><span class="pnum">1–9</span><span class="ptitle">The label</span><span class="pdesc">Serving size through vitamins, line by line</span></div>
        <div><span class="pnum">10–12</span><span class="ptitle">What’s in it</span><span class="pdesc">Ingredient order, additives, ultra-processed food</span></div>
        <div><span class="pnum">13–17</span><span class="ptitle">Beyond the label</span><span class="pdesc">Claims, apps, supplements, and two activities</span></div>
      </div>

    </div></div>`;
}

function topic(id, focus){
  const pg = PAGES[id];
  fillJump(id);
  let body;
  if(pg.hub){
    body = `<div class="doorgrid" style="max-width:760px">
      <button class="door" data-go="filling"><h3>Which is more filling?</h3><p>Five rounds of real foods, head to head.</p></button>
      <button class="door" data-go="claims"><h3>Regulated or marketing?</h3><p>Twelve front-of-package claims.</p></button>
      <button class="door" data-go="rank"><h3>Compare the bars</h3><p>Review four real protein bars and pick one.</p></button></div>`;
  } else if(pg.full){
    body = pg.sections.map(([sid,t,html])=>`<div id="s-${sid}">${t?`<h2>${t}</h2>`:''}${typeof html==='function'?html():html}</div>`).join('');
  } else {
    body = pg.sections.map(([sid,t,html],i)=>`<details class="bar" id="s-${sid}" ${(focus?focus===sid:i===0)?'open':''}><summary>${t}</summary><div class="body">${typeof html==='function'?html():html}</div></details>`).join('');
  }
  const research = pg.research.length ? `<details class="research"><summary>The research</summary><ul>${pg.research.map(k=>`<li>${link(k)}</li>`).join('')}</ul></details>` : '';
  const ti = TOUR.indexOf(id);

  const snip = (!pg.wide && pg.on.length) ? `<div class="snipbox">${labelHTML({mini:true, on:pg.on}).replace('class="label mini"','class="label mini snip"')}</div>` : '';
  const article = `<article>${titleRow(id, pg.title)}${snip}<p class="lede">${pg.lede}</p>${body}${research}${tourHTML(id)}</article>`;
  app.innerHTML = pg.wide ? `<div class="widepage">${article}</div>` :
    `<div class="topic"><aside class="side">${labelHTML({mini:true, on:pg.on})}<div class="note">The highlighted lines are what this step covers.</div></aside>${article}</div>`;
  wire();
  if(focus){ const el = document.getElementById('s-'+focus); if(el) el.scrollIntoView({block:'start'}); }
  else window.scrollTo(0,0);
}

function route(){
  const [id, sub] = location.hash.replace(/^#\/?/,'').split('/');
  if(id && PAGES[id]) topic(id, sub); else { home(); window.scrollTo(0,0); }
}

function refreshLabels(){
  const h = location.hash.replace(/^#\/?/,'').split('/')[0];
  document.querySelectorAll('.label').forEach(el=>{
    el.outerHTML = labelHTML({mini: el.classList.contains('mini'), on: h && PAGES[h] ? PAGES[h].on : []});
  });
}

/* ---------- Games ---------- */
function fillingGame(root){
  let i = 0, score = 0;
  const draw = () => {
    if(i >= ROUNDS.length){
      root.innerHTML = `<div class="out">You got ${score} of ${ROUNDS.length}.</div><p>The pattern: more protein and fiber per calorie, and food you chew rather than drink.</p><button class="btn" data-again>Play again</button>`;
      root.querySelector('[data-again]').onclick = () => { i = 0; score = 0; draw(); };
      return;
    }
    const r = ROUNDS[i];
    root.innerHTML = `<div class="gamebar"><span>Round ${i+1} of ${ROUNDS.length}</span><span class="score">Score: ${score}</span></div>
      <div class="opts">${['a','b'].map(k=>`<button class="opt" data-pick="${k}"><span class="nm">${r[k][0]}</span><span class="facts" hidden>${r[k][1]}</span></button>`).join('')}</div>
      <div class="feedback" data-fb></div>`;
    root.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
      const right = b.dataset.pick === r.win;
      if(right) score++;
      root.querySelectorAll('[data-pick]').forEach(x => { x.disabled = true; x.querySelector('.facts').hidden = false; if(x.dataset.pick === r.win) x.classList.add('right'); });
      root.querySelector('[data-fb]').innerHTML = `<p><b>${right ? 'Right.' : 'Not this time.'}</b> ${r.why}</p><button class="btn" data-next>${i+1 < ROUNDS.length ? 'Next round' : 'See score'}</button>`;
      root.querySelector('[data-next]').onclick = () => { i++; draw(); };
    });
  };
  draw();
}

function claimsGame(root){
  let i = 0, score = 0;
  const draw = () => {
    if(i >= CLAIMS.length){
      root.innerHTML = `<div class="out">You got ${score} of ${CLAIMS.length}.</div><button class="btn" data-again>Play again</button>`;
      root.querySelector('[data-again]').onclick = () => { i = 0; score = 0; draw(); };
      return;
    }
    const c = CLAIMS[i];
    root.innerHTML = `<div class="gamebar"><span>Claim ${i+1} of ${CLAIMS.length}</span><span class="score">Score: ${score}</span></div>
      <p class="out" style="font-size:28px;margin:10px 0">“${c[0]}”</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-ans="r">Regulated</button><button class="btn" data-ans="m">Marketing</button></div>
      <div class="feedback" data-fb></div>`;
    root.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => {
      const right = b.dataset.ans === c[1];
      if(right) score++;
      root.querySelectorAll('[data-ans]').forEach(x => x.disabled = true);
      root.querySelector('[data-fb]').innerHTML = `<p><b>${right ? 'Right.' : 'Not quite.'}</b> It’s ${c[1]==='r' ? 'regulated' : 'marketing'}. ${c[2]}</p><button class="btn ghost" data-next>${i+1 < CLAIMS.length ? 'Next claim' : 'See score'}</button>`;
      root.querySelector('[data-next]').onclick = () => { i++; draw(); };
    });
  };
  draw();
}

function rankGame(root){
  const blank = () => BARS.map(() => ({}));
  let entries = blank(), checked = false, pick = null, reasons = [];
  const read = () => {
    root.querySelectorAll('[data-cf]').forEach(el => {
      const [i,k] = el.dataset.cf.split(':');
      entries[+i][k] = el.type === 'checkbox' ? el.checked : (el.value === '' ? null : +el.value);
    });
  };
  const ratio = a => (a.pro / a.cal * 100);
  const draw = () => {
    let right = 0, total = 0;
    const cols = BARS.map((b,i) => {
      const e = entries[i];
      const nums = CMP_NUM.map(([k,lab,u,ph,help]) => {
        let cls = '', hint = '';
        if(checked){ total++; const ok = e[k] === b.ans[k]; if(ok) right++; cls = ok ? ' ok' : ' bad'; hint = ok ? '' : `<span class="hint2">Label: ${b.ans[k]}${u}</span>`; }
        return `<label class="cf${cls}${help?' count':''}"><span>${lab}${u?` (${u})`:''}</span>${help?`<small class="cfhelp">${help}</small>`:''}<input type="number" min="0" step="1" inputmode="numeric" placeholder="${ph}" data-cf="${i}:${k}" value="${e[k] ?? ''}" ${checked?'disabled':''}>${hint}</label>`;
      }).join('');
      const flags = CMP_FLAG.map(([k,lab]) => {
        let cls = '';
        if(checked){ total++; const ok = !!e[k] === b.ans[k]; if(ok) right++; cls = ok ? ' ok' : ' bad'; }
        const hint = checked && (!!e[k] !== b.ans[k]) ? `<span class="hint2">${b.ans[k] ? 'Yes, it has this' : 'No, it doesn’t'}</span>` : '';
        return `<label class="cflag${cls}"><input type="checkbox" data-cf="${i}:${k}" ${e[k]?'checked':''} ${checked?'disabled':''}> ${lab}${hint}</label>`;
      }).join('');
      return `<div class="barcol">
        <div class="barhead"><span class="nm">${b.name}</span><span class="facts">${b.flavor}</span></div>
        <button class="shot" data-zoom="${b.img}" aria-label="Enlarge the ${b.name} label"><img src="${IMGS[b.img]}" alt="${b.name} ${b.flavor} Nutrition Facts label and ingredient list"></button>
        <div class="cform">${nums}<div class="cflags"><span class="flagtitle">On the ingredient list</span>${flags}</div></div>
      </div>`;
    }).join('');

    const cell = (html, tone) => `<td class="${tone||''}">${tone==='good'?'<span class="tone">Good</span>':tone==='bad'?'<span class="tone">Watch</span>':''}${html}</td>`;
    const table = checked ? `<h2>Side by side</h2>
    <p class="legend"><span class="good">Good</span> <span class="bad">Watch</span> Uncolored cells are in between.</p>
    <div class="scroll"><table class="cmp">
      <tr><th></th>${BARS.map(b=>`<th>${b.name}</th>`).join('')}</tr>
      <tr><td>Protein per 100 cal</td>${BARS.map(b=>{ const r=ratio(b.ans); return cell(`<b>${r.toFixed(1)}g</b>`, r>=10?'good':r<6?'bad':''); }).join('')}</tr>
      <tr><td>Fiber</td>${BARS.map(b=>{ const p=Math.round(b.ans.fib/28*100); return cell(`${b.ans.fib}g (${p}% DV)${b.ans.fiber?'<br><small>Some is added fiber</small>':''}`, p>=20?'good':p<=5?'bad':''); }).join('')}</tr>
      <tr><td>Added sugar</td>${BARS.map(b=>{ const p=Math.round(b.ans.add/50*100); return cell(`${b.ans.add}g (${p}% DV)${b.ans.add?`<br><small>${b.ans.add/4} tsp</small>`:''}`, p>=20?'bad':p<=5?'good':''); }).join('')}</tr>
      <tr><td>Sweeteners</td>${BARS.map(b=>cell(b.sweet, (b.ans.kinds>=2||b.ans.nss||b.ans.alc)?'bad':(b.ans.add===0?'good':''))).join('')}</tr>
      <tr><td>Other additives</td>${BARS.map(b=>cell(b.extras, b.name==='RXBAR'?'good':'')).join('')}</tr>
      <tr><td>Vitamins and minerals at 10%+ DV</td>${BARS.map(b=>cell(String(b.ans.vit), '')).join('')}</tr>
      <tr><td>Fullness</td>${BARS.map(b=>{ const r=ratio(b.ans); return cell(r>=10?'More filling':r>=6?'Moderate':'Less filling', r>=10?'good':r<6?'bad':''); }).join('')}</tr>
      <tr><td>Worth knowing</td>${BARS.map(b=>`<td>${b.note}</td>`).join('')}</tr>
    </table></div>
    <h2>Your pick</h2>
    <div class="pickrow">${BARS.map((b,i)=>`<label class="pickopt${pick===i?' on':''}"><input type="radio" name="barpick" value="${i}" ${pick===i?'checked':''}> ${b.name}</label>`).join('')}</div>
    <p style="margin:12px 0 6px"><b>Why?</b> Choose any that apply.</p>
    <div class="pickrow">${['Most protein','Most fiber','Least added sugar','Simplest ingredients','No non-sugar sweeteners','Taste or price'].map(r=>`<label class="pickopt${reasons.includes(r)?' on':''}"><input type="checkbox" data-reason="${r}" ${reasons.includes(r)?'checked':''}> ${r}</label>`).join('')}</div>
    ${pick!==null ? `<div class="verdict" style="margin-top:14px"><b>You picked ${BARS[pick].name}${reasons.length?` for: ${reasons.join(', ').toLowerCase()}`:''}.</b> There’s no single right answer. The best choice depends on what matters to you, and now you know how to read for it.</div>` : ''}` : '';

    root.innerHTML = `<div class="tool" style="margin-bottom:16px">
        <div class="gamebar"><span>${checked ? `<b>You matched ${right} of ${total} answers.</b> Fields in red show what the label says.` : 'Tap a photo to enlarge it. Fill in what you can, then check your answers.'}</span>
        <span style="display:flex;gap:10px;flex-wrap:wrap">${checked ? '' : '<button class="btn" data-ccheck>Check my answers</button><button class="btn ghost" data-cskip>Skip to the comparison</button>'}<button class="btn ghost" data-creset>Start over</button></span></div></div>
      <div class="barsgrid">${cols}</div>${table}
      <p style="font-size:14px;color:var(--muted);margin-top:12px">Label images from the brands’ online listings. Recipes change, so check the package you have.</p>`;

    root.querySelectorAll('[data-cf]').forEach(el => el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', read));
    const ck = root.querySelector('[data-ccheck]'); if(ck) ck.onclick = () => { read(); checked = true; draw(); };
    const sk = root.querySelector('[data-cskip]'); if(sk) sk.onclick = () => { read(); entries = BARS.map(b => ({...b.ans})); checked = true; draw(); };
    root.querySelector('[data-creset]').onclick = () => { entries = blank(); checked = false; pick = null; reasons = []; draw(); };
    root.querySelectorAll('input[name="barpick"]').forEach(r => r.onchange = () => { pick = +r.value; draw(); });
    root.querySelectorAll('[data-reason]').forEach(c => c.onchange = () => { const v = c.dataset.reason; reasons = c.checked ? [...reasons, v] : reasons.filter(x => x !== v); draw(); });
  };
  draw();
}

function zoom(key){
  const ov = document.createElement('div');
  ov.className = 'lightbox';
  ov.setAttribute('role','dialog');
  ov.setAttribute('aria-label','Enlarged label');
  ov.innerHTML = `<img src="${IMGS[key]}" alt=""><button class="btn" data-close>Close</button>`;
  const close = () => { ov.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => { if(e.key === 'Escape') close(); };
  ov.onclick = close;
  document.addEventListener('keydown', esc);
  document.body.appendChild(ov);
  ov.querySelector('[data-close]').focus();
}

function wire(){
  document.querySelectorAll('[data-pneed]').forEach(t=>{
    const lb=t.querySelector('[data-lb]'), act=t.querySelector('[data-act]'), o=t.querySelector('[data-nout]'), det=t.querySelector('[data-ndetail]');
    const R = {rda:[0.8,0.8,'the RDA, the minimum to meet basic needs'], active:[1.2,1.6,'a common range for regularly active adults'], train:[1.6,2.0,'the upper range sports nutrition groups suggest for hard training']};
    const f=()=>{
      const w=+lb.value;
      if(!w || w<50){ o.textContent='Enter a body weight in pounds.'; det.textContent=''; return; }
      const kg=w/2.2046, [lo,hi,label]=R[act.value];
      const a=Math.round(kg*lo), b=Math.round(kg*hi);
      const range = a===b ? `${a}g` : `${a}–${b}g`;
      const meal = a===b ? `${Math.round(a/3)}g` : `${Math.round(a/3)}–${Math.round(b/3)}g`;
      o.textContent = `${w} lb = ${Math.round(kg*10)/10} kg → about ${range} of protein a day`;
      det.textContent = `That’s ${lo===hi?lo:lo+'–'+hi}g per kg, ${label}. Spread over 3 meals, it’s about ${meal} per meal.`;
    };
    lb.oninput=f; act.onchange=f; f();
  });
  document.querySelectorAll('[data-pcalc]').forEach(t=>{
    const p=t.querySelector('[data-p]'), c=t.querySelector('[data-c]'), o=t.querySelector('[data-pout]');
    const f=()=>{ const pv=+p.value, cv=+c.value; if(!cv){o.textContent='Enter calories to calculate.';return;}
      const r=Math.round(pv/cv*1000)/10; o.textContent=`${r}g protein per 100 calories. ${r>=10?'A filling pick.':'Less filling for the calories.'}`; };
    p.oninput=f; c.oninput=f; f();
  });
  document.querySelectorAll('[data-scalc]').forEach(t=>{
    const s=t.querySelector('[data-s]'), o=t.querySelector('[data-sout]'), cb=t.querySelector('[data-cubes]');
    const f=()=>{ const g=Math.max(0,+s.value||0), tsp=g/4, full=Math.floor(tsp), half=tsp-full>=0.5;
      o.textContent=`${g}g is about ${Math.round(tsp*10)/10} teaspoons, or ${Math.round(g/25*100)}% of a 25g day.`;
      cb.innerHTML='<span class="cube"></span>'.repeat(Math.min(full,60))+(half?'<span class="cube part"></span>':''); };
    s.oninput=f; t.querySelectorAll('[data-sset]').forEach(b=>b.onclick=()=>{s.value=b.dataset.sset;f();}); f();
  });
  document.querySelectorAll('[data-group]').forEach(t=>{
    let ca = false; const l=t.querySelector('[data-glist]'), b=t.querySelector('[data-gtoggle]');
    b.onclick=()=>{ ca=!ca; l.innerHTML = ca ? CA_LIST : US_LIST; b.textContent = ca ? 'Show the US label' : 'Show the Canadian label'; };
  });
  document.querySelectorAll('[data-fill]').forEach(fillingGame);
  document.querySelectorAll('[data-claims]').forEach(claimsGame);
  document.querySelectorAll('[data-rank]').forEach(rankGame);
  document.querySelectorAll('[data-review]').forEach(t=>{
    const v=t.querySelector('[data-verdict]');
    const val=k=>{const e=t.querySelector(`[data-f="${k}"]`);return e.value===''?null:+e.value;};
    const f=()=>{
      const cal=val('cal'), pro=val('pro'), fib=val('fib'), add=val('add'), n=val('n')||1, app=val('app'), kinds=val('kinds');
      const flags=[...t.querySelectorAll('[data-flag]')].filter(x=>x.checked).length;
      if(cal===null||pro===null){v.textContent='Fill in calories and protein to see the results.';return;}
      const lines=[], r=cal?Math.round(pro/cal*1000)/10:0;
      lines.push(`<b>Protein per 100 calories:</b> ${r}g ${r>=10?'(filling pick)':'(under the 10g rule of thumb)'}`);
      if(fib!==null) lines.push(`<b>Fiber:</b> ${fib}g, about ${Math.round(fib/28*100)}% DV`);
      if(add!==null) lines.push(`<b>Added sugar:</b> ${add}g, about ${Math.round(add/4*10)/10} teaspoons (${Math.round(add/50*100)}% DV${add/50>=.2?', high':''})`);
      if(kinds!==null && kinds>=2) lines.push(`<b>Sugar is split across ${kinds} names.</b> Together it may rank higher than the list suggests.`);
      if(n>1) lines.push(`<b>Whole package:</b> ${Math.round(cal*n)} calories${add!==null?` and ${Math.round(add*n)}g added sugar`:''}`);
      lines.push(`<b>Flags spotted:</b> ${flags}`);
      const filling = r>=10 || (fib!==null && fib>=5 && r>=6);
      lines.push(`<b>Overall:</b> ${filling?'More filling':'Less filling'}${app!==null?`. Yuka gave it ${app}/100. Do you agree with the app?`:'.'}`);
      v.innerHTML=lines.join('<br>');
    };
    t.querySelectorAll('input').forEach(i=>i.addEventListener('input',f));
    t.querySelector('[data-reset]').onclick=()=>{t.querySelectorAll('input').forEach(i=>{if(i.type==='checkbox')i.checked=false;else i.value=i.dataset.f==='n'?1:'';});f();};
    f();
  });
}

document.addEventListener('click', e=>{
  if(e.target.closest('.card a')) return;
  const go = e.target.closest('[data-go]');
  if(go){ const r = go.dataset.go; location.hash = r ? '#/'+r : '#/'; return; }
  const z = e.target.closest('[data-zoom]');
  if(z){ zoom(z.dataset.zoom); return; }
  const cd = e.target.closest('[data-colordv]');
  if(cd){ colorDV = !colorDV; refreshLabels(); cd.textContent = colorDV?'Turn off color-coding':'Color-code the label'; return; }
  const fl = e.target.closest('[data-flip]');
  if(fl){
    const c = SCARY[+fl.dataset.flip], open = fl.getAttribute('aria-expanded')==='true';
    fl.innerHTML = open ? `<span class="nm">${c[0]}</span><span class="q">Fine, or worth a closer look?</span>`
      : `<span class="nm">${c[0]}</span><span class="v ${c[1]}">${c[1]==='ok'?'Fine':'Worth a closer look'}</span><span class="ex">${c[2]}</span>${c[3]?`<a class="ex" href="${SRC[c[3]][1]}" target="_blank" rel="noopener">See the source</a>`:''}`;
    fl.setAttribute('aria-expanded', String(!open));
  }
});
document.addEventListener('keydown', e=>{
  const c = e.target.closest && e.target.closest('.card[role=button]');
  if(c && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); c.click(); }
});
const themeBtn = document.getElementById('theme'), themeLabel = document.getElementById('themelabel');
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeLabel.textContent = t === 'dark' ? 'Light' : 'Dark';
  try { localStorage.setItem('label-theme', t); } catch(e){}
}
let saved = null;
try { saved = localStorage.getItem('label-theme'); } catch(e){}
setTheme(saved || 'light');
themeBtn.onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

window.addEventListener('hashchange', route);
route();

</script>
